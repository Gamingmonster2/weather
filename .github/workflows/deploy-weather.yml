name: Deploy weather.com.ly

# Cloudflare Pages only allows one Git-connected project per repository.
# Rain.ly stays on its existing Git-connected Pages project. weather.com.ly is
# a Direct Upload project published from this workflow, so this repo remains
# the single source of truth for both sites.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-weather
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build weather.com.ly
        # build.mjs produces dist/rain and dist/weather and copies
        # workers/_worker.js into each output (Pages Advanced Mode).
        run: npm run build

      - name: Publish to Cloudflare Pages (Direct Upload)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/weather --project-name=weather-com-ly --branch=main
